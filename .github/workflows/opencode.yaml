name: opencode agent

on:
  workflow_call:

concurrency:
  group: opencode-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  opencode:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/opencode')
    steps:
      # The opencode action skips its own permission check when
      # use_github_token is true, so gate the commenter here: only accounts
      # with write access may summon the agent with the workflow's token.
      - name: Check commenter write access
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          perm=$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" --jq '.permission')
          if [ "$perm" = "admin" ] || [ "$perm" = "write" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Commenter ${ACTOR} has '${perm}' access; ignoring mention."
          fi

      # The opencode action fetches and checks out the PR branch itself,
      # but it needs an existing repository with an origin remote to do so.
      # persist-credentials must stay true: the handler skips its own git
      # auth setup when use_github_token is true and relies on the
      # checkout-stored token for its final push. The token is job-scoped.
      - uses: actions/checkout@v6
        if: steps.perm.outputs.ok == 'true'

      - name: Run opencode
        if: steps.perm.outputs.ok == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/deepseek/deepseek-v4-flash-0731
          use_github_token: true
